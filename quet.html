<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quét đơn TimiShop</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--n:#0e1318;--c:#182029;--c2:#212b36;--t:#eef2f6;--m:#93a1b0;--x:#2fbf71;--v:#f0a43a;--d:#ef5350;--b:#4a9cf5;--p:#b06cf0;--ln:#2b3642}
*{box-sizing:border-box}
html,body{margin:0;background:var(--n);color:var(--t);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top b{font-size:16px}.m{color:var(--m);font-size:13px}
.dem{text-align:right;line-height:1}.dem b{font-size:34px;font-variant-numeric:tabular-nums}.dem small{display:block;color:var(--m);font-size:12px;margin-top:2px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:12px;padding:10px 6px;font-size:15px;font-weight:600}
.seg button.on.DI{background:#1f5f3f;border-color:var(--x)}.seg button.on.HOAN{background:#5c3f14;border-color:var(--v)}
.seg button:disabled{opacity:.35}
.seg .so{display:inline-block;min-width:24px;margin-left:4px;padding:0 6px;border-radius:99px;background:#ffffff26;font-size:13px}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:42vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.khung{position:absolute;left:8%;right:8%;top:16%;bottom:16%;border:3px solid #ffffffb3;border-radius:10px;box-shadow:0 0 0 999px #00000059}
.tia{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--d);opacity:.8}
.bao{position:absolute;left:8px;right:8px;bottom:8px;padding:8px 10px;border-radius:10px;font-weight:700;text-align:center;display:none;background:#1e8e3ee6}
.batdau{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.batdau button{background:var(--b);color:#fff;border:0;border-radius:14px;padding:16px 22px;font-size:17px;font-weight:700}
.cong{display:flex;gap:6px;margin:8px 0}
.cong button{flex:1;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:10px;padding:9px 4px;font-size:14px}
.cong button.bat{background:#3d4a14;border-color:#c0d84a}
.tay{display:none;gap:6px;margin-bottom:8px}.tay input{flex:1;min-width:0;background:var(--c);color:var(--t);border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:16px;text-transform:uppercase}
.tay button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:700}
.tde{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px}.tde b{font-size:15px}
.ds{display:grid;gap:8px}
.it{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:10px;display:grid;gap:6px}
.it .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it .ma{font:600 15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.stt{display:inline-block;min-width:34px;text-align:center;font:700 14px ui-monospace,Menlo,monospace;background:#ffffff1f;border-radius:8px;padding:2px 6px;margin-right:6px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.moi{background:#2fbf7133;color:var(--x)}.chip.loi{background:#ef535033;color:var(--d)}.chip.cho{background:#ffffff1f;color:var(--m)}
.it .act{display:flex;flex-wrap:wrap;gap:6px}
.it .act button{border:1px solid var(--ln);background:var(--c2);color:var(--t);border-radius:8px;padding:6px 10px;font-size:13px}
.it .act button.on{background:#5c3f14;border-color:var(--v)}
.it .act button.xoa{color:var(--d)}
.it img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.anhs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.loi{color:var(--d)}
#ban{font-size:11px;color:var(--m);text-align:center;margin-top:12px}
/* popup chặn */
.pop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#000000b3}
.pop .hop{width:100%;max-width:420px;border-radius:18px;padding:20px 18px 16px;color:#fff;text-align:center;box-shadow:0 10px 40px #0009}
.pop.TRUNG .hop{background:#8a4d00}.pop.FUN .hop{background:#5b2a8c}.pop.HUY .hop{background:#9b1c1c}
.pop .ic{font-size:46px;line-height:1}
.pop h2{margin:8px 0 6px;font-size:21px}
.pop .ma{font:700 19px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#00000040;border-radius:10px;padding:8px;margin:8px 0}
.pop p{margin:6px 0;font-size:15px;white-space:pre-line}
.pop button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:800;background:#fff;color:#111}
</style></head><body>
<div class="w">
  <div class="top"><div><b id="ten">Quét đơn</b><div class="m" id="tt">Đang tải…</div></div>
    <div class="dem"><b id="demLon">0</b><small id="demNhan">đơn đi hôm nay</small></div></div>
  <div class="seg"><button id="sDI" class="DI on">📤 Đơn đi<span class="so" id="nDI">0</span></button>
    <button id="sHOAN" class="HOAN">📥 Đơn hoàn<span class="so" id="nHOAN">0</span></button></div>
  <div class="cam"><video id="vid" playsinline autoplay muted></video><div class="khung"></div><div class="tia"></div>
    <div class="bao" id="bao"></div>
    <div class="batdau" id="batdau"><div><button id="nutBd" disabled>Đang mở camera…</button><div class="m" style="margin-top:10px">Camera bật liên tục. Đưa mã vạch hoặc mã QR vào khung, máy kêu "bíp" là xong, quét tiếp mã sau.</div></div></div>
  </div>
  <div class="cong"><button id="nDen">🔦 Đèn</button><button id="nTay">⌨️ Nhập tay</button><button id="nDung">⏸ Tạm dừng</button></div>
  <div class="tay" id="tay"><input id="oTay" placeholder="Gõ mã vận đơn" autocomplete="off"><button id="guiTay">Ghi</button></div>
  <div class="tde"><b id="tdeDs">Đơn đi đã quét hôm nay</b><span class="m" id="cho"></span></div>
  <div class="ds" id="ds"></div>
  <div id="ban">Trang quét v3</div>
</div>
<div class="pop" id="pop"><div class="hop"><div class="ic" id="pIc"></div><h2 id="pTd"></h2><div class="ma" id="pMa"></div><p id="pNd"></p>
  <button id="pOk">OK – quét tiếp</button></div></div>
<script>
const EXEC='https://script.google.com/macros/s/AKfycbzBTUAQ1A3MIz8BlhbKHYIsQbPKV9rxjbHgOGoLSZwiaQa8KjIu756s_oZzVWt-pGc/exec';
const $=i=>document.getElementById(i);
let initData='',tt=null,loai='DI',luong=null,det=null,zx=null,dang=false,dungTam=false,den=false,popMo=false;
const ds={DI:[],HOAN:[]},daCo={DI:new Set(),HOAN:new Set()},TINH=['Nguyên vẹn','Móp/bẹp','Rách','Thiếu hàng','Ướt'];
let huy={};const ganDay=new Map();const choTai=[];
// hàng chờ trên điện thoại: mã đã quét mà máy chủ chưa xác nhận, giữ lại cả khi tắt Telegram, mở lại tự gửi tiếp
const KHO='timi_quet_cho';
function docCho(){try{return JSON.parse(localStorage.getItem(KHO)||'[]').filter(c=>Date.now()-c.luc<864e5);}catch(e){return[];}}
function ghiCho(a){try{localStorage.setItem(KHO,JSON.stringify(a));}catch(e){}}
function boCho(x){ghiCho(docCho().filter(c=>!(c.loai===x.loai&&c.ma===x.ma)));}
function themCho(x){const a=docCho().filter(c=>!(c.loai===x.loai&&c.ma===x.ma));a.push({loai:x.loai,ma:x.ma,gio:x.gio,luc:Date.now()});ghiCho(a);}
// máy không có bộ đọc mã sẵn (iPhone) mới tải thư viện zxing, tải ngầm ngay lúc mở trang
function canZx(){return !('BarcodeDetector' in window);}
if(canZx()){const sc=document.createElement('script');sc.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';sc.async=true;document.head.appendChild(sc);}
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
function tach(h){h=String(h||'').replace(/^#/,'');const i=h.indexOf('tgWebAppData=');if(i<0)return'';let v=h.slice(i+13);
  const j=v.search(/&tgWebApp[A-Za-z]+=/);if(j>=0)v=v.slice(0,j);if(v.indexOf('=')<0){try{v=decodeURIComponent(v);}catch(e){}}return v;}
try{initData=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||tach(location.hash);}catch(e){initData=tach(location.hash);}
function goi(app,body){return fetch(EXEC+'?app='+app,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({initData},body))}).then(r=>r.json());}
// ghi đơn: gửi máy chủ nhanh (Cloudflare) nếu Apps Script đã cấp vé; lỗi mạng/máy chủ thì gửi Apps Script như cũ
function ghiDon(b){if(!(tt&&tt.nhanh&&tt.ve))return goi('qd',b);
  const ac=new AbortController(),hen=setTimeout(()=>ac.abort(),6000);
  return fetch(tt.nhanh,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({ve:tt.ve},b)),signal:ac.signal})
    .then(r=>r.json()).then(r=>{clearTimeout(hen);return r.loiMay?duPhong(b,r.text):r;}).catch(e=>{clearTimeout(hen);return duPhong(b,e&&e.name==='AbortError'?'quá 6 giây':'lỗi mạng');});}
function duPhong(b,ly){return goi('qd',b).then(r=>{r.duPhong=ly||'';     // máy chủ nhanh có thể đã ghi rồi mới mất kết nối -> báo trùng chính mình thì coi như đã ghi
  if(r.chan==='TRUNG'&&r.ai===tt.ten&&vuaQuet(r.luc))return{ok:true,moi:true,ma:r.ma,stt:r.stt,gio:String(r.luc).slice(11,16),duPhong:r.duPhong};return r;});}
function vuaQuet(luc){const m=String(luc||'').match(/^(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/);if(!m)return false;
  const t=Date.UTC(+m[3],m[2]-1,+m[1],+m[4]-7,+m[5]);return Math.abs(Date.now()-t)<5*60000;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// ---------- âm thanh, rung
let ac=null;
function tieng(kieu){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  const b={ok:[[1400,0]],TRUNG:[[500,0],[500,.2]],FUN:[[700,0],[400,.18],[700,.36]],HUY:[[300,0],[300,.2],[300,.4],[300,.6]],loi:[[250,0]]}[kieu]||[[300,0]];
  b.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=kieu==='ok'?'sine':'square';
    g.gain.setValueAtTime(0.25,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+0.15);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+0.16);});}catch(e){}
  try{Telegram.WebApp.HapticFeedback.notificationOccurred(kieu==='ok'?'success':'error');}catch(e){try{navigator.vibrate&&navigator.vibrate(kieu==='ok'?60:[200,100,200]);}catch(e2){}}}
let tb=null;
function bao(t){const b=$('bao');b.textContent=t;b.style.display='block';clearTimeout(tb);tb=setTimeout(()=>b.style.display='none',t.indexOf('Đã lưu')>=0?4000:1500);}
// ---------- popup chặn: dừng camera đọc mã đến khi bấm OK
function popup(kieu,ma,nd){const P={TRUNG:['🟠','ĐƠN TRÙNG – ĐÃ QUÉT RỒI'],FUN:['🟣','MÃ FUN – CHƯA ĐẨY SANG ĐƠN VỊ VẬN CHUYỂN'],HUY:['🔴','ĐƠN ĐÃ HỦY – KHÔNG GIAO']}[kieu];
  popMo=true;$('pop').className='pop '+kieu;$('pop').style.display='flex';$('pIc').textContent=P[0];$('pTd').textContent=P[1];$('pMa').textContent=ma;$('pNd').textContent=nd||'';
  try{$('vid').pause();}catch(e){}tieng(kieu);}
function capNhatPop(ma,nd){if(popMo&&$('pMa').textContent===ma)$('pNd').textContent=nd;}
$('pOk').onclick=()=>{popMo=false;$('pop').style.display='none';try{$('vid').play();}catch(e){}
  ganDay.set(loai+$('pMa').textContent,Date.now()+5000);};   // tem vẫn trước camera: bỏ qua mã này thêm vài giây
const ND={FUN:'Đơn này chưa có mã vận đơn của SPX – shipper sẽ không nhận.\nĐể gói này RIÊNG RA, in lại phiếu từ Sapo rồi quét phiếu mới.',
  HUY:r=>'Đơn '+(r.maDon||'')+' · '+(r.loaiHuy||r.loai||'Đã hủy')+(r.luc?' lúc '+r.luc:'')+(r.khach?'\nKhách: '+r.khach:'')+'\nRút gói này ra, KHÔNG giao cho shipper.',
  TRUNG:r=>r&&r.luc?('Đã quét lúc '+r.luc+(r.ai?' · '+r.ai:'')+(r.stt?' · STT '+r.stt:'')+(r.tt?'\nTrạng thái: '+r.tt:'')+'\nKiểm tra xem có bị in/đóng 2 lần không.'):'Mã này đã có trong danh sách. Đang lấy chi tiết…'};
// ---------- chế độ, đếm
function chonLoai(l){if(tt&&tt.quyen.indexOf(l)<0)return;loai=l;['DI','HOAN'].forEach(k=>$('s'+k).classList.toggle('on',k===l));ve();}
$('sDI').onclick=()=>chonLoai('DI');$('sHOAN').onclick=()=>chonLoai('HOAN');
function demHomNay(l){return ds[l].filter(x=>x.tt==='moi').length;}
function capSo(){['DI','HOAN'].forEach(k=>$('n'+k).textContent=demHomNay(k));$('demLon').textContent=demHomNay(loai);
  $('demNhan').textContent=(loai==='DI'?'đơn đi':'đơn hoàn')+' hôm nay';$('tdeDs').textContent=(loai==='DI'?'Đơn đi':'Đơn hoàn')+' đã quét hôm nay';
  const cho=ds.DI.concat(ds.HOAN).filter(x=>x.tt==='cho'||x.tt==='loi').length;$('cho').textContent=cho?('⏳ '+cho+' đang gửi'):'';
  try{cho?Telegram.WebApp.enableClosingConfirmation():Telegram.WebApp.disableClosingConfirmation();}catch(e){}}
// ---------- danh sách
function ve(){const el=$('ds');el.innerHTML='';ds[loai].filter(x=>x.tt!=='xoa').forEach(x=>{const d=document.createElement('div');d.className='it';
  const chip={moi:x.tg?'<span class="chip" style="white-space:normal;background:#ffffff14">'+esc(x.tg)+'</span>':'',cho:'<span class="chip cho">⏳ Đang gửi</span>',loi:'<span class="chip loi">❌ Chưa ghi</span>'}[x.tt]||'';
  let h='<div class="r"><span>'+(x.stt?'<span class="stt">'+esc(x.stt)+'</span>':'')+'<span class="ma">'+esc(x.ma)+'</span></span>'+chip+'</div>'+
    '<div class="m">'+esc(x.gio||'')+(x.ai?' · '+esc(x.ai):'')+(x.donDi?' · khớp đơn đi '+esc(x.donDi.ngay)+(x.donDi.tt?' ('+esc(x.donDi.tt)+')':''):'')+
    (x.lyDo?' · <span class="loi">'+esc(x.lyDo)+'</span>':'')+(x.loi?' · <span class="loi">'+esc(x.loi)+'</span>':'')+'</div>';
  if(x.tt==='moi'){h+='<div class="act">';
    if(x.loai==='HOAN')TINH.forEach(t=>h+='<button data-a="tinh" data-v="'+t+'" class="'+(x.tinh===t?'on':'')+'">'+t+'</button>');
    h+='<button data-a="anh">📷 Chụp gói hàng</button>'+(x.cuaToi?'<button data-a="xoa" class="xoa">🗑 Xóa</button>':'')+'</div>';}
  if(x.tt==='loi')h+='<div class="act"><button data-a="lai">↻ Gửi lại</button></div>';
  if(x.anhs.length||x.soAnh)h+='<div class="anhs">'+x.anhs.map(a=>'<img src="'+a.src+'" alt="ảnh '+esc(x.ma)+'">'+(a.ok?'':'<span class="m">'+(a.loi?'❌':'⏳')+'</span>')).join('')+
    (x.soAnh?'<span class="m">📷 '+x.soAnh+' ảnh đã lưu</span>':'')+'</div>';
  d.innerHTML=h;d.querySelectorAll('button').forEach(b=>b.onclick=()=>hanhDong(x,b.dataset.a,b.dataset.v));el.appendChild(d);});capSo();}
function hanhDong(x,a,v){
  if(a==='lai'){gui(x);return;}
  if(a==='tinh'){x.tinh=v;ve();goi('qc',{loai:x.loai,ma:x.ma,tinhTrang:v}).then(r=>{if(!r.ok){x.loi=r.text;ve();}}).catch(()=>{x.loi='Mất mạng – chọn lại';ve();});return;}
  if(a==='anh'){const s=chup();if(!s){bao('Bật camera trước');return;}const o={src:s,ok:false};x.anhs.push(o);ve();
    goi('qc',{loai:x.loai,ma:x.ma,anh:s.split(',')[1]}).then(r=>{o.ok=r.ok;o.loi=!r.ok;if(!r.ok)x.loi=r.text;ve();}).catch(()=>{o.loi=true;x.loi='Mất mạng – ảnh chưa lưu';ve();});return;}
  if(a==='xoa'){if(x.hoiXoa!==1){x.hoiXoa=1;bao('Bấm 🗑 Xóa lần nữa để xóa '+x.ma);setTimeout(()=>x.hoiXoa=0,4000);return;}
    goi('qx',{loai:x.loai,ma:x.ma}).then(r=>{if(r.ok){x.tt='xoa';daCo[x.loai].delete(x.ma);}else x.loi=r.text;ve();}).catch(()=>{x.loi='Mất mạng';ve();});}
}
// ---------- quét được mã
function gioNay(){return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});}
function chuan(s){s=String(s||'').trim().toUpperCase();const m=s.match(/SPXVN[0-9A-Z]{8,14}/)||s.match(/FUN\d{3,12}/);return m?m[0]:s.replace(/\s+/g,'').slice(0,60);}
function nhan(raw){if(popMo)return;const ma=chuan(raw);if(ma.length<6)return;
  if(!tt){if(choTai.indexOf(loai+'|'+ma)<0){choTai.push(loai+'|'+ma);tieng('ok');bao('✓ '+ma+' · chờ tải xong sẽ ghi');}return;}
  const l=loai,now=Date.now();
  if(ganDay.has(l+ma)&&now-ganDay.get(l+ma)<3000)return;ganDay.set(l+ma,now);
  if(l==='DI'&&/^FUN/.test(ma)){popup('FUN',ma,ND.FUN);return;}
  if(daCo[l].has(ma)){popup('TRUNG',ma,ND.TRUNG(null));ghiDon({loai:l,ma}).then(r=>{if(r.chan==='TRUNG')capNhatPop(ma,ND.TRUNG(r));}).catch(()=>{});return;}
  if(l==='DI'&&huy[ma]){popup('HUY',ma,ND.HUY(Object.assign({loaiHuy:huy[ma].loai},huy[ma])));return;}
  daCo[l].add(ma);const x={ma,loai:l,tt:'cho',gio:gioNay(),anhs:[],cuaToi:true,ai:tt.ten};ds[l].unshift(x);themCho(x);tieng('ok');bao('✓ '+ma+' · đã nhận');ve();gui(x);}
function gui(x,lan){x.tt='cho';x.loi='';ve();lan=lan||0;const t0=Date.now();
  ghiDon({loai:x.loai,ma:x.ma}).then(r=>{
    if(!r.ok){x.tt='loi';x.loi=r.text;tieng('loi');ve();return;}
    // gửi lại từ hàng chờ: lần trước đã ghi xong nhưng chưa kịp nhận trả lời -> coi như đã lưu
    if(r.chan==='TRUNG'&&x.tuHang&&r.ai===tt.ten){boCho(x);x.tt='moi';x.stt=r.stt;x.gio=String(r.luc||'').slice(11,16)||x.gio;ve();return;}
    boCho(x);
    if(r.chan){x.tt='xoa';ve();popup(r.chan,x.ma,r.chan==='FUN'?ND.FUN:r.chan==='HUY'?ND.HUY(r):ND.TRUNG(r));return;}
    x.tt='moi';x.stt=r.stt;x.gio=r.gio||x.gio;x.donDi=r.donDi;ve();const giay=((Date.now()-t0)/1000).toFixed(1);x.tg=(r.nhanh?'⚡ ':'🐢 ')+giay+'s'+(r.ms?' · máy chủ '+(r.ms/1000).toFixed(1)+'s':'')+(r.t?' ('+r.t+')':'')+(r.duPhong?' · dự phòng: '+r.duPhong:'');ve();
    bao((r.nhanh?'⚡ ':'✓ ')+'Đã lưu '+x.ma+' · '+giay+' giây');
  }).catch(()=>{x.tt='loi';x.loi='Mất mạng – tự gửi lại';ve();if(lan<20)setTimeout(()=>gui(x,lan+1),4000);});}
// ---------- camera & đọc mã
function chup(){const v=$('vid');if(!luong||!v.videoWidth)return null;const M=1280,s=Math.min(1,M/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.7);}
let dangMo=false,hong=false;
async function batCam(tuDong){if(luong||dangMo)return;dangMo=true;try{await moCam(tuDong);}finally{dangMo=false;}}
async function moCam(tuDong){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){$('batdau').innerHTML='<div class="loi">❌ Telegram trên máy này không cho trang dùng camera. Cập nhật Telegram, hoặc báo quản lý.</div>';return;}
  try{luong=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});if(hong){luong.getTracks().forEach(t=>t.stop());luong=null;return;}}
  catch(e){luong=null;if(tuDong){$('nutBd').disabled=false;$('nutBd').textContent='📷 Bắt đầu quét';return;}$('batdau').innerHTML='<div class="loi">❌ Không mở được camera: '+esc(e.name||e)+'<br>Cài đặt → Ứng dụng → Telegram → Quyền → cho phép Máy ảnh, rồi mở lại trang.</div>';return;}
  const v=$('vid');v.srcObject=luong;try{await v.play();}catch(e){}
  $('batdau').style.display='none';
  try{if(ac)ac.resume();else ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();const can=['code_128','qr_code','code_39','ean_13','data_matrix'].filter(x=>f.indexOf(x)>=0);
    if(can.indexOf('code_128')>=0&&can.indexOf('qr_code')>=0)det=new BarcodeDetector({formats:can});}}catch(e){det=null;}
  taoZx();hienBan();
  const tr=luong.getVideoTracks()[0];let cap={};try{cap=tr.getCapabilities?tr.getCapabilities():{};}catch(e){}if(!cap.torch)$('nDen').disabled=true;
  dang=true;vong();}
function taoZx(){if(det||zx||!window.ZXing)return;const H=new Map();H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13]);
  H.set(ZXing.DecodeHintType.TRY_HARDER,true);zx=new ZXing.MultiFormatReader();zx.setHints(H);hienBan();}
function hienBan(){$('ban').textContent='Trang quét v4 · đọc mã: '+(det?'máy':zx?'zxing':'đang tải…')+' · '+((window.Telegram&&Telegram.WebApp.platform)||'?');}
$('nutBd').onclick=()=>batCam(false);
function tatQuet(){hong=true;dang=false;choTai.length=0;$('nutBd').disabled=true;if(luong){luong.getTracks().forEach(t=>t.stop());luong=null;}$('batdau').style.display='grid';}
const cv=document.createElement('canvas');
async function doc(){const v=$('vid');if(!v.videoWidth)return null;
  if(det){const r=await det.detect(v);return r.length?r[0].rawValue:null;}
  if(!zx){taoZx();if(!zx)return null;}
  const W=v.videoWidth,Hh=v.videoHeight,cw=Math.min(960,W),ch=Math.round(Hh*cw/W);cv.width=cw;cv.height=ch;
  cv.getContext('2d').drawImage(v,0,0,cw,ch);
  try{const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);const bm=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));return zx.decodeWithState(bm).getText();}
  catch(e){return null;}finally{try{zx.reset();}catch(e){}}}
async function vong(){if(!dang)return;if(!dungTam&&!popMo){try{const t=await doc();if(t)nhan(t);}catch(e){}}setTimeout(vong,det?120:220);}
$('nDung').onclick=()=>{dungTam=!dungTam;$('nDung').textContent=dungTam?'▶️ Quét tiếp':'⏸ Tạm dừng';$('nDung').classList.toggle('bat',dungTam);};
$('nDen').onclick=async()=>{if(!luong)return;den=!den;try{await luong.getVideoTracks()[0].applyConstraints({advanced:[{torch:den}]});$('nDen').classList.toggle('bat',den);}catch(e){den=false;}};
$('nTay').onclick=()=>{const t=$('tay');t.style.display=t.style.display==='flex'?'none':'flex';if(t.style.display==='flex')$('oTay').focus();};
$('guiTay').onclick=()=>{const v=$('oTay').value;if(v.trim()){ganDay.clear();nhan(v);$('oTay').value='';}};
$('oTay').onkeydown=e=>{if(e.key==='Enter')$('guiTay').click();};
// ---------- mở trang: lấy đơn hôm nay + danh sách đã có + đơn hủy
goi('qt',{}).then(r=>{if(!r.ok){$('tt').innerHTML='<span class="loi">'+esc(r.loi)+'</span>';tatQuet();$('nutBd').textContent='Không mở được';return;}
  tt=r;huy=r.huy||{};$('ten').textContent='👋 '+r.ten;
  ['DI','HOAN'].forEach(k=>{$('s'+k).disabled=r.quyen.indexOf(k)<0;(r.daCo[k]||[]).forEach(m=>daCo[k].add(m));
    ds[k]=(r.homNay[k]||[]).slice().reverse().map(x=>({ma:String(x.ma).toUpperCase(),loai:k,tt:'moi',stt:x.stt,gio:x.gio,ai:x.ai,tinh:x.tinh,lyDo:x.lyDo,soAnh:x.anh,anhs:[],cuaToi:x.ai===r.ten}));});
  $('tt').textContent='Quét liên tục · '+Object.keys(huy).length+' mã hủy đang theo dõi';
  docCho().forEach(c=>{if(r.quyen.indexOf(c.loai)<0)return;if(daCo[c.loai].has(c.ma)){boCho(c);return;}
    daCo[c.loai].add(c.ma);const x={ma:c.ma,loai:c.loai,tt:'cho',gio:c.gio,anhs:[],cuaToi:true,ai:r.ten,tuHang:true};ds[c.loai].unshift(x);gui(x);});
  setInterval(lamMoi,60000);
  if(r.quyen.indexOf(loai)<0)loai=r.quyen.indexOf('DI')>=0?'DI':'HOAN';chonLoai(loai);
  choTai.splice(0).forEach(k=>{const i=k.indexOf('|'),l=k.slice(0,i),m=k.slice(i+1);if(r.quyen.indexOf(l)<0)return;const cu=loai;loai=l;ganDay.clear();nhan(m);loai=cu;});ve();
}).catch(e=>{$('tt').innerHTML='<span class="loi">Không kết nối được máy chủ: '+esc(e)+'</span>';});
// mỗi phút lấy lại danh sách đã quét (của cả người khác) + đơn hủy, để đối chiếu trên điện thoại luôn mới
function lamMoi(){if(document.hidden||!tt)return;goi('qt',{}).then(r=>{if(!r.ok)return;huy=r.huy||huy;if(r.ve)tt.ve=r.ve;
  ['DI','HOAN'].forEach(k=>{(r.daCo[k]||[]).forEach(m=>daCo[k].add(m));
    (r.homNay[k]||[]).forEach(y=>{const ma=String(y.ma).toUpperCase();if(ds[k].some(z=>z.ma===ma))return;
      ds[k].push({ma,loai:k,tt:'moi',stt:y.stt,gio:y.gio,ai:y.ai,tinh:y.tinh,lyDo:y.lyDo,soAnh:y.anh,anhs:[],cuaToi:y.ai===tt.ten});});
    ds[k].sort((a,b)=>(a.tt==='moi'?1:0)-(b.tt==='moi'?1:0)||(+b.stt||0)-(+a.stt||0));});
  $('tt').textContent='Quét liên tục · '+Object.keys(huy).length+' mã hủy đang theo dõi';ve();}).catch(()=>{});}
// mở camera ngay, song song với lúc tải dữ liệu (không đợi bấm nút). Máy không cho tự mở thì hiện nút.
batCam(true);
</script></body></html>
